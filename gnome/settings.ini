# Curated GNOME settings. Regenerate with gnome/dump.sh, apply with gnome/setup.sh

[org/gnome/Console]
audible-bell=false
custom-font='MesloLGLDZ Nerd Font Mono 12'
font-scale=0.90000000000000002
use-system-font=false
visual-bell=false

[org/gnome/GWeather4]
temperature-unit='centigrade'

[org/gnome/desktop/app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus']

[org/gnome/desktop/app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[org/gnome/desktop/app-folders/folders/System]
apps=['org.gnome.DiskUtility.desktop', 'org.gnome.SystemMonitor.desktop', 'org.gnome.tweaks.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[org/gnome/desktop/app-folders/folders/Utilities]
apps=['org.gnome.Papers.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.Loupe.desktop', 'org.gnome.Showtime.desktop']
name='X-GNOME-Shell-Utilities.directory'
translate=true

[org/gnome/desktop/app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[org/gnome/desktop/background]
picture-uri='file:///usr/share/endeavouros/backgrounds/endeavouros-wallpaper.png'

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us')]

[org/gnome/desktop/interface]
accent-color='pink'
cursor-theme='WhiteSur-cursors'
enable-animations=true
gtk-theme='WhiteSur-Dark-solid'
icon-theme='WhiteSur'
show-battery-percentage=true
color-scheme='prefer-dark'

[org/gnome/desktop/peripherals/mouse]
natural-scroll=false

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=false

[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'

[org/gnome/shell]
disabled-extensions=['light-style@gnome-shell-extensions.gcampax.github.com', 'places-menu@gnome-shell-extensions.gcampax.github.com', 'drive-menu@gnome-shell-extensions.gcampax.github.com', 'apps-menu@gnome-shell-extensions.gcampax.github.com', 'system-monitor@gnome-shell-extensions.gcampax.github.com']
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'all-in-one-clipboard@NiffirgkcaJ.github.com', 'preserve-battery-health@marcosdalvarez.org', 'layout-labels@bielarusajed.gay', 'ds4battery@slie.ru', 'vpn-indicator@fthx', 'appindicatorsupport@rgcjonas.gmail.com', 'dash-to-dock@micxgx.gmail.com', 'dynamic-music-pill@andbal', 'screenshot-window-sizer@gnome-shell-extensions.gcampax.github.com', 'status-icons@gnome-shell-extensions.gcampax.github.com']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Console.desktop', 'brave-origin.desktop', 'grok-bot.desktop', 'Happ.desktop', 'tauonmb.desktop']

[org/gnome/shell/extensions/all-in-one-clipboard]
enable-recents-tab=true

[org/gnome/shell/extensions/appindicator]
icon-brightness=0.0
icon-contrast=0.0
icon-opacity=240
icon-saturation=0.0
icon-size=0

[org/gnome/shell/extensions/dash-to-dock]
apply-custom-theme=false
background-opacity=0.80000000000000004
custom-theme-shrink=true
dash-max-icon-size=24
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
intellihide-mode='FOCUS_APPLICATION_WINDOWS'
isolate-workspaces=false
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'
preview-size-scale=0.0
show-mounts-network=true

[org/gnome/shell/extensions/dynamic-music-pill]
always-show-pill=true
app-name-mapping='tauon:ENTER_APP_ID_HERE'
enable-lyrics=true
enable-scroll-controls=false
enable-shadow=false
enable-transparency=true
has-seen-first-hint=true
hide-text=false
lyric-fade-duration=100
lyric-fade-enable=false
lyrics-language-preference=0
panel-art-size=29
panel-pill-height=26
panel-pill-width=420
pill-dynamic-width=true
pill-enable-word-level=false
popup-custom-width=360
popup-follow-custom-bg=false
popup-follow-custom-text=false
popup-follow-transparency=false
popup-hide-on-leave=true
popup-hide-pill-visualizer=false
popup-show-album-title=true
popup-show-player-selector=true
popup-show-visualizer=false
popup-vinyl-rotate=false
popup-vinyl-square=true
position-mode=3
selected-player-bus='org.mpris.MediaPlayer2.tauon'
show-pill-border=false
sync-accent-color=true
tablet-mode=0
target-container=1
transparency-art=false
use-custom-colors=false
visualizer-bar-width=4
visualizer-bars=10
visualizer-padding=10
visualizer-style=2

[org/gnome/shell/extensions/user-theme]
name='WhiteSur-Dark'

[org/gnome/tweaks]
show-extensions-notice=false
