# Night City (Cyberpunk 2077) for kitty.
# Generated from themes/night-city/palette.sh by generate.sh; edit the template, not dist/.
#
# install.sh links this file as BOTH:
#   ~/.config/kitty/current-theme.conf   (pulled in by `globinclude current-theme.conf` in kitty.conf)
#   ~/.config/kitty/dark-theme.auto.conf (kitty's dark-mode auto theme; it only reads the colours
#                                         from it, so the non-colour settings below come from
#                                         current-theme.conf)
# Reload a running kitty with ctrl+shift+f5.

## name: Night City
## blurb: Neon yellow, cyan and red on void black, after Cyberpunk 2077

#: Basic colours
foreground              #E4F7F7
background              #0A0A0F
selection_foreground    #0A0A0F
selection_background    #FCEE0A

#: Cursor
cursor                  #FCEE0A
cursor_text_color       #0A0A0F
cursor_trail_color      #00F0FF

#: URLs
url_color               #00F0FF

#: Window borders and bell
active_border_color     #FCEE0A
inactive_border_color   #2A2D3A
bell_border_color       #FF003C
visual_bell_color       none

#: Tab bar
tab_bar_background      #0A0A0F
tab_bar_margin_color    #0A0A0F
active_tab_foreground   #0A0A0F
active_tab_background   #FCEE0A
inactive_tab_foreground #00F0FF
inactive_tab_background #1B1D26

#: Marks
mark1_foreground #0A0A0F
mark1_background #FCEE0A
mark2_foreground #0A0A0F
mark2_background #00F0FF
mark3_foreground #0A0A0F
mark3_background #FF2BD6

#: The 16 terminal colours
# black
color0  #1B1D26
color8  #555B70
# red
color1  #FF003C
color9  #FF4D6D
# green
color2  #00FF9F
color10 #5CFFC0
# yellow
color3  #FCEE0A
color11 #FFF75C
# blue
color4  #3D7BFF
color12 #7AA5FF
# magenta
color5  #FF2BD6
color13 #FF7AE6
# cyan
color6  #00F0FF
color14 #66F6FF
# white
color7  #E4F7F7
color15 #FFFFFF

#: Style (used via current-theme.conf; ignored in dark-theme.auto.conf)
cursor_shape                 beam
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval        0.5 ease-in-out
tab_bar_style                powerline
tab_powerline_style          round
active_tab_font_style        bold
inactive_tab_font_style      normal
